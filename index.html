<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quicklist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <a href="#" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Voltar
    </a>
  </header>

  <main class="container">
    <h1 class="page-title">Compras da semana</h1>

    <form id="add-item-form" class="add-item-form">
      <label for="item-input" class="sr-only">Novo item</label>
      <input type="text" id="item-input" class="item-input" placeholder="Adicione um novo item" autocomplete="off">
      <button type="submit" class="add-item-button">Adicionar item</button>
      <p class="input-error" aria-live="polite" hidden></p>
    </form>

    <ul id="item-list" class="item-list">
      <li class="item">
        <label class="item-label">
          <input type="checkbox" class="item-checkbox">
          <span class="item-name">Pão de forma</span>
        </label>
        <button type="button" class="item-remove" aria-label="Remover Pão de forma">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>
          </svg>
        </button>
      </li>
      <li class="item">
        <label class="item-label">
          <input type="checkbox" class="item-checkbox">
          <span class="item-name">Café preto</span>
        </label>
        <button type="button" class="item-remove" aria-label="Remover Café preto">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>
          </svg>
        </button>
      </li>
      <li class="item">
        <label class="item-label">
          <input type="checkbox" class="item-checkbox">
          <span class="item-name">Suco de laranja</span>
        </label>
        <button type="button" class="item-remove" aria-label="Remover Suco de laranja">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>
          </svg>
        </button>
      </li>
      <li class="item">
        <label class="item-label">
          <input type="checkbox" class="item-checkbox">
          <span class="item-name">Bolacha</span>
        </label>
        <button type="button" class="item-remove" aria-label="Remover Bolacha">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>
          </svg>
        </button>
      </li>
    </ul>
  </main>

  <div id="alert" class="alert" role="alert" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 8v4M12 16h.01"/>
    </svg>
    <p>O item foi removido da lista</p>
    <button type="button" class="alert-close" aria-label="Fechar alerta">X</button>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
